[project]
name = "cti-v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jassi789012", email = "jassi789012singh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "playwright>=1.63.0",
    "psycopg-binary>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-nmap>=0.7.1",
    "sqlalchemy>=2.1.5",
]

[project.scripts]
cti-v2 = "cti_v2:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
